services:
  # Backend API
  schem-api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - BUILD_TIMESTAMP=${BUILD_TIMESTAMP}
        - BUILD_VERSION=${BUILD_VERSION}
    container_name: schem-api
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - SECRET_KEY=${SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8081}
    volumes:
      # Persistir uploads temporários (se necessário)
      - ./api/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - schem-network

  # Frontend
  schem-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/convert}
        - BUILD_TIMESTAMP=${BUILD_TIMESTAMP}
        - BUILD_VERSION=${BUILD_VERSION}
    container_name: schem-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - schem-api
    networks:
      - schem-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  schem-network:
    driver: bridge
