version: '3.8'

services:
  schem-converter-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schem-converter-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    working_dir: /app
    networks:
      - schem-network-prod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  schem-network-prod:
    driver: bridge
