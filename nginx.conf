server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    
    # Limite de tamanho de upload (50MB - mesmo limite da API)
    client_max_body_size 50M;
    
    # Aumentar limite de tamanho da URL (padrão é 8KB)
    large_client_header_buffers 16 64k;

    # Logs de acesso e erro
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Cache agressivo para assets estáticos gerados pelo build
    location ~* \.(?:js|css|ico|png|jpe?g|gif|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy para API - comunicação interna via Docker network
    location ^~ /convert {
        proxy_pass http://schem-api:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout aumentado para uploads grandes
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # Proxy para SSE (Server-Sent Events) - logs em tempo real
    location ^~ /conversion-logs {
        proxy_pass http://schem-api:3002;
        proxy_http_version 1.1;
        proxy_set_header Cache-Control no-cache;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers específicos para SSE
        add_header Cache-Control no-cache;
        add_header X-Accel-Buffering no;
    }

    # Health check da API
    location ^~ /health {
        proxy_pass http://schem-api:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA - fallback para index.html em quaisquer rotas do app (DEVE SER O ÚLTIMO)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

}
